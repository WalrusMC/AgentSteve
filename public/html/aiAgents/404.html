<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WalrusMC AI Agents | Page Not Found</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Open Sans", sans-serif;
      background: radial-gradient(circle at top, #1b1f3d, #0f1124);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 520px;
      padding: 40px;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #6aa8ff;
      margin-bottom: 10px;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 1rem;
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .button {
      padding: 12px 22px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .button.primary {
      background: linear-gradient(135deg, #4c7dff, #6aa8ff);
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(106, 168, 255, 0.35);
    }

    .button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      opacity: 0.6;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="error-code">404</div>

    <div class="title">Page Not Found</div>

    <div class="subtitle">
      Looks like this page doesn’t exist!<br>
      Double-check the URL or head back to safety.
    </div>

    <div class="actions">
      <a href="/aiagents" class="button primary">Go Home</a>
      <a href="/" class="button secondary">WalrusMC</a>
    </div>

    <footer>
      WalrusMC AI Agents • Agent Steve
    </footer>
  </div>
</body>
</html>
